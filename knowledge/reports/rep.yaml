id: REP

title: Final Analytical Report

version: 1.0

document_type: report

status: active

template: REP.template.md

description: >
  Automatically generated final analytical report describing
  the results of an SSP consulting project.

inputs:

  - project
  - contractor
  - client
  - service
  - report

sources:

  - SRV
  - Project
  - Check-up
  - Findings

generation:

  trigger: ProjectCompleted

outputs:

  - pdf

business_events:

  created: ReportGenerated

storage:

  workspace: true

  database: true

editable: true

language: ru-RU

sections:

  - project_passport
  - project_goal
  - input_data
  - analysis
  - problems
  - causes
  - recommendations
  - action_plan
  - conclusion

traceability:

  enabled: true

  chain:

    - input_data
    - analysis
    - problems
    - causes
    - recommendations
    - action_plan

validation:

  require_analysis: true

  require_problem_for_recommendation: true

  require_cause_for_recommendation: true

quality_control:

  logical_consistency: true

  completeness_check: true